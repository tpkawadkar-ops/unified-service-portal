<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seva सेतु – Unified Service Management Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font for Hindi -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #8b5e3c, #a97c50); /* Earthy brown */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            border-radius: 14px;
            background: white;
            box-shadow:
                0 0 30px rgba(139, 94, 60, 0.6),
                0 8px 20px rgba(0,0,0,0.15);
        }

        /* Branding */
        .brand-title {
            text-align: center;
            font-family: "Times New Roman", serif; /* Seva font */
            font-size: 34px;
            font-weight: 600;
            color: #4b2e1e;
            margin-bottom: 2px;
        }

        .brand-title span {
            font-family: 'Noto Serif Devanagari', serif; /* Hindi font */
            font-weight: 500;
            font-size: 26px;
            margin-left: 4px;
        }

        .brand-subtitle {
            text-align: center;
            font-family: "Times New Roman", serif;
            font-style: italic;
            font-size: 16px;
            color: #6d4a2f;
            margin-bottom: 28px;
        }

        .btn-primary {
            background-color: #8b5e3c;
            border: none;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #744a2e;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- Branding -->
        <div class="brand-title">
            Seva <span>सेतु</span>
        </div>
        <div class="brand-subtitle">
            Unified Service Portal
        </div>

        <!-- Login Form -->
        <form action="/" method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text"
                       class="form-control"
                       name="username"
                       placeholder="Enter username"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="Enter password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">
                Login
            </button>
        </form>

    </div>

</body>
</html>
