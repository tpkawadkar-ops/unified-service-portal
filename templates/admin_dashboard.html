<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3efe9; /* soft earthy background */
    }

    /* ---------- Header ---------- */
    header {
      background: linear-gradient(135deg, #8b5e3c, #a97c50);
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: 600;
      position: relative;
      text-align: center;
    }

    header a {
      position: absolute;
      right: 20px;
      top: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    header a:hover {
      text-decoration: underline;
    }

    /* ---------- Layout ---------- */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* ---------- Summary ---------- */
    .summary {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(139, 94, 60, 0.25);
      flex: 1;
      text-align: center;
    }

    .summary-card h2 {
      margin: 0;
      color: #4b2e1e;
    }

    .summary-card p {
      margin-top: 6px;
      color: #6d4a2f;
      font-size: 14px;
    }

    /* ---------- Main Card ---------- */
    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(139, 94, 60, 0.25);
    }

    .card h3 {
      margin-top: 0;
      color: #4b2e1e;
      font-weight: 600;
    }

    /* ---------- Table ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f7f2ec;
      color: #4b2e1e;
    }

    /* ---------- Controls ---------- */
    select {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #cdb7a3;
    }

    button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background-color: #8b5e3c;
      color: white;
      cursor: pointer;
      margin-left: 6px;
      font-size: 13px;
    }

    button:hover {
      background-color: #744a2e;
    }
  </style>
</head>

<body>

<header>
  Admin Dashboard
  <a href="/logout">Logout</a>
</header>

<div class="container">

  <!-- Summary -->
  <div class="summary">
    {% for c in counts %}
    <div class="summary-card">
      <h2>{{ c[1] }}</h2>
      <p>{{ c[0] }}</p>
    </div>
    {% endfor %}
  </div>

  <!-- Requests -->
  <div class="card">
    <h3>Manage Requests</h3>

    <table>
      <tr>
        <th>Title</th>
        <th>User</th>
        <th>Category</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Update</th>
      </tr>

      {% for r in requests %}
      <tr>
        <td>{{ r[1] }}</td>
        <td>{{ r[5] }}</td>
        <td>{{ r[2] }}</td>
        <td>{{ r[3] }}</td>
        <td>{{ r[4] }}</td>
        <td>
          <form method="post" action="/update-status">
            <input type="hidden" name="request_id" value="{{ r[0] }}">
            <select name="status">
              <option {% if r[4]=='Submitted' %}selected{% endif %}>Submitted</option>
              <option {% if r[4]=='In Progress' %}selected{% endif %}>In Progress</option>
              <option {% if r[4]=='Resolved' %}selected{% endif %}>Resolved</option>
            </select>
            <button type="submit">Update</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>

</div>

</body>
</html>
