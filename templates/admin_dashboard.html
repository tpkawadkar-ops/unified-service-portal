<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Segoe UI; background:#f0f2f5; margin:0; }
    header { background:#2c5364; color:white; padding:20px; text-align:center; position:relative; }
    header a { position:absolute; right:20px; top:20px; color:white; text-decoration:none; }
    .summary { display:flex; gap:20px; padding:20px; }
    .card { background:white; padding:15px; flex:1; text-align:center; border-radius:10px; }
    table { width:95%; margin:20px auto; border-collapse:collapse; background:white; }
    th, td { padding:10px; border-bottom:1px solid #ddd; }
  </style>
</head>

<body>
<header>
  Admin Dashboard
  <a href="/logout">Logout</a>
</header>

<div class="summary">
  {% for c in counts %}
  <div class="card">
    <h2>{{ c[1] }}</h2>
    <p>{{ c[0] }}</p>
  </div>
  {% endfor %}
</div>

<table>
  <tr>
    <th>Title</th>
    <th>User</th>
    <th>Category</th>
    <th>Priority</th>
    <th>Status</th>
    <th>Update</th>
  </tr>

  {% for r in requests %}
  <tr>
    <td>{{ r[1] }}</td>
    <td>{{ r[5] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[4] }}</td>
    <td>
      <form method="post" action="/update-status">
        <input type="hidden" name="request_id" value="{{ r[0] }}">
        <select name="status">
          <option {% if r[4]=='Submitted' %}selected{% endif %}>Submitted</option>
          <option {% if r[4]=='In Progress' %}selected{% endif %}>In Progress</option>
          <option {% if r[4]=='Resolved' %}selected{% endif %}>Resolved</option>
        </select>
        <button>Update</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
</body>
</html>
