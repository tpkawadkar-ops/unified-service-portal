<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>
  <style>
    body { font-family: Segoe UI; background:#f0f2f5; margin:0; }
    header { background:#2575fc; color:white; padding:20px; text-align:center; position:relative; }
    header a { position:absolute; right:20px; top:20px; color:white; text-decoration:none; }
    .card { background:white; padding:25px; width:350px; margin:40px auto; border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,.15); }
    input, select, button { width:100%; padding:10px; margin-top:10px; }
    button { background:#2575fc; color:white; border:none; }
    a.link { display:block; text-align:center; margin-top:15px; text-decoration:none; color:#2575fc; }
  </style>
</head>

<body>
<header>
  Unified Service Management Portal
  <a href="/logout">Logout</a>
</header>

<div class="card">
  <h3>Submit Service Request</h3>

  <form method="post" action="/submit">
    <input name="title" placeholder="Request Title" required>
    <input name="category" placeholder="Category" required>
    <select name="priority" required>
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
    </select>
    <button type="submit">Submit</button>
  </form>

  <a class="link" href="/my-requests">📄 My Requests</a>
</div>
</body>
</html>
