<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests - Unified Service Management Portal</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .container {
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .card {
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      padding: 25px;
      width: 90%;
      max-width: 900px;
    }

    .card h3 {
      margin-top: 0;
      color: #2575fc;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f4f6fb;
    }

    .status {
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
      font-size: 14px;
    }

    .Submitted {
      background-color: #fff3cd;
      color: #856404;
    }

    .In\ Progress {
      background-color: #d1ecf1;
      color: #0c5460;
    }

    .Resolved {
      background-color: #d4edda;
      color: #155724;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #2575fc;
      font-weight: bold;
    }

  </style>
</head>

<body>

<header>
  Unified Service Management Portal
</header>

<div class="container">

  <div class="card">
    <a href="/dashboard" class="back-link">⬅ Back to Dashboard</a>

    <h3>My Service Requests</h3>

    {% if requests %}
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Priority</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for r in requests %}
        <tr>
          <td>{{ r[1] }}</td>
          <td>{{ r[2] }}</td>
          <td>{{ r[3] }}</td>
          <td>
            <span class="status {{ r[4] }}">
              {{ r[4] }}
            </span>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
      <p>No requests submitted yet.</p>
    {% endif %}
  </div>

</div>

</body>
